[env:geekmagic_ultra]
platform = espressif8266
board = esp12e
framework = arduino

; Run ESP8266 at 160MHz for ultra-smooth sprite compositing & snappy web UI
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dout
; 4MB Flash: 1MB Sketch/OTA + 3MB LittleFS (matches stock SmallTV-Ultra layout so LittleFS & OTA space align)
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = littlefs

monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DNDEBUG
    -Os
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_SPI_MODE=SPI_MODE3
    -DSPI_FREQUENCY=40000000
    -DSUPPORT_TRANSACTIONS

; GeekMagic SmallTV Pro: classic ESP32, 8 MB flash. OTA application only.
[env:geekmagic_pro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
extra_scripts = pre:tools/pack_web.py
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.9
build_flags =
    -DGEEKCLOCK_SMALLTV_PRO=1
    -DGEEKCLOCK_TOUCH_PIN=32
    -DGEEKCLOCK_BACKLIGHT_PIN=25
    -DGEEKCLOCK_BACKLIGHT_INVERT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=-1
    -DTFT_DC=2
    -DTFT_RST=4
    -DSPI_FREQUENCY=40000000
    -DCORE_DEBUG_LEVEL=0
    -Os
